name: flutter_4sessentials
description: "4S Essentials  App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  animate_do: ^3.3.4
  flutter_screenutil: ^5.9.3

  # Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_storage: ^13.4.1

  # Utilities
  image_picker: ^1.1.2
  pdf: ^3.10.8
  printing: ^5.11.1
  path_provider: ^2.1.1
  share_plus: ^10.0.3
  fl_chart: ^0.66.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/splash_logo.png
    - assets/images/splash_bg.png

    - assets/images/onboarding/onboarding_1.png
    - assets/images/onboarding/onboarding_2.png
    - assets/images/onboarding/onboarding_3.png
    - assets/images/onboarding/onboarding_4.png
    - assets/images/onboarding/onboarding_5.png